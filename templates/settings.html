{% extends 'base.html' %}{% block content %}
<header class="page-head">
 <div>
  <p class="eyebrow">
   PREFERENCES
  </p>
  <h1>
   Settings
  </h1>
  <p class="muted">
   Update your administrator account.
  </p>
 </div>
</header>
<section class="panel narrow">
 <form class="form-grid single" method="post">
  <label>
   Admin name
   <input name="name" required="" value="{{ session.get('user_name','Admin') }}"/>
  </label>
  <label>
   New password (leave blank to keep current)
   <input autocomplete="new-password" minlength="8" name="password" type="password"/>
  </label>
  <div class="form-action">
   <button class="primary">
    Save settings
   </button>
  </div>
 </form>
 <p class="muted tiny">
  Use a unique password before sharing the website online.
 </p>
</section>
{% endblock %}
